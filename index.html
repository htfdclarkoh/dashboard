<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://api.weather.gov https://script.google.com https://script.googleusercontent.com; frame-src https:; font-src 'self' data:">
  <title>HTFD Dashboard</title>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon.png">
  <link rel="stylesheet" href="assets/tailwind.css">
  <script src="vendor/feather.min.js" defer></script>
  <script src="dayjs.min.js" defer></script>

  <style>
    body { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
    .feather { width: 1em; height: 1em; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .feed-item { opacity: 0; transform: translateY(2rem); transition: opacity 0.8s cubic-bezier(0.25, 0.8, 0.25, 1), transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1); }
    .feed-item.active { opacity: 1; transform: translateY(0); }
    .feed-item.fading-out { opacity: 0; transform: translateY(-2rem); }
    @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
    .animate-marquee { animation: marquee 20s linear infinite; }
    .ticker-hidden { display: none; }
    .ticker-visible { display: flex; }
    .slide { display: flex; align-items: stretch; justify-content: stretch; overflow: hidden; background: #000; }
    .slide > iframe { display: block; width: 100%; height: 100% !important; max-width: none; max-height: none; aspect-ratio: auto; border: 0; }
    .status-dot { width: .55rem; height: .55rem; border-radius: 9999px; display: inline-block; background: #22c55e; }
    .status-dot.warn { background: #f59e0b; }
    .status-dot.error { background: #ef4444; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen w-full overflow-hidden cursor-none">

  <div class="flex-grow flex flex-col md:flex-row min-h-0 transition-all duration-500 ease-in-out" id="main-content-area">
    <aside class="w-full md:w-64 bg-gray-800 text-white flex md:flex-col justify-around md:justify-between items-center p-4 md:p-5 flex-shrink-0 z-20 shadow-lg">
      <div class="flex flex-col items-center text-center">
        <img id="dashboard-logo" src="assets/icon.png" alt="Harmony Township Fire Department logo" class="w-40 md:w-60 h-auto rounded-lg">
      </div>

      <div id="toolbar-weather-widget" class="text-center">
          <div id="weather-icon-container" class="w-24 h-24 mx-auto mb-2 flex items-center justify-center">
              <i data-feather="loader" class="animate-spin text-blue-300 w-16 h-16"></i>
          </div>
          <p id="weather-temp" class="text-6xl font-black">--°</p>
          <p id="weather-condition" class="text-2xl text-gray-300 mt-2">Loading...</p>
          <p id="weather-location" class="text-xl font-bold mt-2">...</p>
          <p id="weather-high-low" class="text-md text-gray-400">H: --° L: --°</p>
      </div>
      
      <div id="sidebar-alert-display" class="w-full hidden px-2 my-2 transition-all duration-300">
      </div>
      
      <div id="clock-container" class="w-full my-4 flex flex-col items-center justify-center text-center">
          <div id="local-time" class="text-4xl lg:text-5xl font-black text-white tracking-wider">--:--:--</div>
          <div id="local-date" class="text-lg lg:text-xl font-bold text-gray-400 mt-1 pb-2">Loading...</div>
      </div>
      <div id="dashboard-health" class="w-full text-center text-xs text-gray-400" aria-live="polite">
        <span id="health-dot" class="status-dot warn" aria-hidden="true"></span>
        <span id="health-text">Connecting…</span>
      </div>
    </aside>

    <main class="flex-grow relative min-h-0">
      <div class="slides" id="slidesContainer">
        <div class="slide absolute inset-0 w-full h-full opacity-0 transition-opacity duration-1000 ease-in-out"></div>
        <div class="slide absolute inset-0 w-full h-full opacity-0 transition-opacity duration-1000 ease-in-out"></div>
      </div>
    </main>
  </div>

  <div id="ipawsAlertOverlay" class="fixed inset-0 bg-black bg-opacity-95 text-red-500 text-3xl md:text-5xl font-black flex justify-center items-center text-center z-[9999] p-5 leading-tight opacity-0 invisible transition-opacity duration-500">
  </div>
  
  <div id="dispatchAlertOverlay" class="fixed inset-0 bg-black bg-opacity-95 z-[10000] hidden justify-center items-center p-8 transition-opacity duration-500 opacity-0">
    <div class="bg-red-800 text-white p-12 rounded-3xl shadow-2xl max-w-7xl w-full border-8 border-yellow-400 animate-pulse">
        <div class="flex justify-between items-start mb-6 border-b-4 border-red-600 pb-6">
            <div>
                <h1 id="run-type" class="text-8xl md:text-9xl font-black text-yellow-300 uppercase tracking-wider">Fall</h1>
            </div>
            <div class="text-right">
                <p id="run-dispatch" class="text-5xl font-black bg-red-900 px-6 py-2 rounded-lg border-2 border-red-700">HTFD</p>
            </div>
        </div>
        <div class="mb-8">
            <h2 id="run-location" class="text-7xl md:text-8xl font-bold uppercase leading-tight w-full break-words">422 N BURNETT RD</h2>
            <h3 id="run-city" class="text-4xl font-semibold text-gray-300 mt-2">SPRINGFIELD</h3>
            <p id="run-location-info" class="text-4xl mt-4 text-yellow-200 font-medium">Good Shepherd Village</p>
        </div>
        <div class="bg-red-950 p-6 rounded-xl border border-red-800">
            <p class="text-2xl text-red-400 font-bold uppercase mb-2">Call Type / Notes</p>
            <p id="run-narrative" class="text-5xl leading-snug font-bold">MED1</p>
            <p id="run-supplemental" class="text-3xl mt-6 text-gray-400 border-t border-red-900 pt-6 whitespace-pre-line"></p>
        </div>
        <div class="mt-8 flex justify-between items-center text-2xl text-gray-400 font-mono">
            <span id="run-incident">Inc: 26-031118</span>
            <span id="run-timestamp">2026-03-23 08:11:20</span>
        </div>
    </div>
  </div>

  <div id="ticker-bar" class="w-full h-20 bg-red-900 border-t-4 border-red-700 flex-shrink-0 z-50 hidden items-center overflow-hidden shadow-2xl relative">
      <div id="ticker-content" class="whitespace-nowrap text-4xl font-bold text-white uppercase tracking-wider px-4">
      </div>
  </div>

  <audio id="alertSound"></audio>

  <script type="module">
    import { initializeApp, getFirestore, doc, onSnapshot, collection, query, orderBy, setDoc, serverTimestamp } from "./vendor/firebase.js";
    import { buildEventKey, escapeHtml, isContentExpired } from "./shared/dashboard-utils.mjs";
 
    document.addEventListener('DOMContentLoaded', async () => {
        
        // --- NATIVE LOCAL CLOCK ---
        function updateLocalClock() {
            if (typeof dayjs === 'undefined') return;
            const now = dayjs();
            document.getElementById('local-time').textContent = now.format('HH:mm:ss');
            document.getElementById('local-date').textContent = now.format('dddd, MMMM D');
        }
        setInterval(updateLocalClock, 1000);
        updateLocalClock();

        const firebaseConfig = {
          apiKey: "AIzaSyCqqW_fryqigzg7zDWgEsuADhBkPYcHQMo",
          authDomain: "db2-2f64c.firebaseapp.com",
          projectId: "db2-2f64c",
          storageBucket: "db2-2f64c.firebasestorage.app",
          messagingSenderId: "234811583682",
          appId: "1:234811583682:web:aa2bd4e29296207c0d5f5b",
          measurementId: "G-38MS80C490"
        };

        let db; 
        let dashboardConfig = null; 
        let slideSources = []; 
        const shownAlerts = new Set();
        const storage = {
            get(key) { try { return window.localStorage.getItem(key); } catch (_) { return null; } },
            set(key, value) { try { window.localStorage.setItem(key, value); } catch (_) {} }
        };
        const newDeviceId = () => globalThis.crypto?.randomUUID?.() || `device-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        const deviceId = storage.get('htfdDeviceId') || newDeviceId();
        storage.set('htfdDeviceId', deviceId);
        let alertQueue = [];
        let alertShowing = false;
        let dispatchTranslations = {};

        function updateHealth(state, message) {
            const dot = document.getElementById('health-dot');
            const text = document.getElementById('health-text');
            dot.className = `status-dot${state === 'ok' ? '' : state === 'warn' ? ' warn' : ' error'}`;
            text.textContent = message;
        }

        window.addEventListener('error', event => {
            console.error('Dashboard error:', event.error || event.message);
            updateHealth('error', 'Display error · check logs');
        });
        window.addEventListener('unhandledrejection', event => {
            console.error('Dashboard promise error:', event.reason);
            updateHealth('error', 'Connection error · retrying');
        });

        window.addEventListener('online', () => updateHealth('warn', 'Reconnecting…'));
        window.addEventListener('offline', () => updateHealth('error', 'Offline · cached display'));
        
        let ipawsInterval = null;
        let weatherInterval = null;
        let slidesRefreshInterval = null;
        let slideRotationTimer = null;
        let tickerInterval = null; 

        const slideDivs = document.querySelectorAll('.slide');
        let contentIndex = 0;
        let activeSlideIndex = 0;
        
        const googleSlideSource = { type: 'googleslides', iframe: ``, duration: 20000, order: 1 };
        
        const newsFeedSlideSource = {
            type: 'newsfeed',
            iframe: `<div id="feed-container" class="relative w-full h-full overflow-hidden bg-gradient-to-br from-gray-900 to-gray-800 text-white font-sans">
                        <div id="feed-track" class="absolute top-0 left-0 w-full h-full"></div>
                     </div>`,
            duration: 60000, 
            order: 2 
        };

        let newsFeedPosts = []; 
        let allNewsFeedPosts = [];
        let newsFeedSlideInterval = null; 

        function initializeTicker() {
            const tickerRef = collection(db, 'ticker');
            
            onSnapshot(tickerRef, (snapshot) => {
                const allMessages = [];
                snapshot.forEach(doc => { allMessages.push(doc.data()); });
                
                const checkTicker = () => {
                    if (typeof dayjs === 'undefined') return;
                    const now = dayjs();
                    
                    const activeMessages = allMessages.filter(msg => {
                        const start = dayjs(msg.startDateTime);
                        const end = dayjs(msg.endDateTime);
                        return start.isValid() && end.isValid() && now.isAfter(start) && now.isBefore(end);
                    }).map(msg => msg.message);

                    const tickerBar = document.getElementById('ticker-bar');
                    const tickerContent = document.getElementById('ticker-content');
                    
                    if (activeMessages.length > 0) {
                        const fullText = activeMessages.join('   +++   ');
                        tickerContent.textContent = fullText;
                        
                        if (!tickerContent.classList.contains('animate-marquee')) {
                             tickerContent.classList.add('animate-marquee');
                        }

                        const estimatedTextWidth = fullText.length * 25; 
                        const totalDistance = window.innerWidth + estimatedTextWidth;
                        const speedPixelsPerSecond = 150; 
                        const duration = totalDistance / speedPixelsPerSecond;

                        tickerContent.style.animationDuration = `${duration}s`;

                        tickerBar.classList.remove('hidden');
                        tickerBar.classList.add('flex');
                    } else {
                        tickerBar.classList.add('hidden');
                        tickerBar.classList.remove('flex');
                        tickerContent.classList.remove('animate-marquee');
                    }
                };

                checkTicker();

                if (tickerInterval) clearInterval(tickerInterval);
                tickerInterval = setInterval(checkTicker, 60000); 
            });
        }

        let audioEnabled = true; 
        const alertAudioElement = document.getElementById('alertSound');
        const toneFileMap = {
            'default': 'sounds/default.mp3', 'alarm': 'sounds/alarm.mp3',
            'chime': 'sounds/chime.mp3', 'ascending': 'sounds/ascending.mp3'
        };

        function playAlertSound(toneName = 'default') {
            if (!audioEnabled) {
              console.warn("Audio not enabled.");
              return;
            }
            const fileName = toneFileMap[toneName] || `sounds/${toneName}`; 
            alertAudioElement.src = fileName;
            alertAudioElement.play().catch(error => {
              console.error(`Error playing sound "${fileName}":`, error);
              const overlay = document.getElementById("ipawsAlertOverlay");
              const errorSpan = document.createElement('span');
              errorSpan.textContent = ` [Audio file not found: ${fileName}]`;
              errorSpan.className = 'text-yellow-500 text-xl block mt-4';
              if (!overlay.querySelector('span')) overlay.appendChild(errorSpan);
            });
        }

        function normalizeNewsPost(data, id) {
            return {
                id,
                title: data.title || data['Title *'] || data.Title || '',
                description: data.description || data.Description || '',
                location: data.location || data.Location || '',
                appliesTo: data.appliesTo || data['Applies To'] || '',
                postedBy: data.postedBy || data['Posted by'] || '',
                postDate: data.postDate || data['Date/Time to Post'] || '',
                removeDate: data.removeDate || data['Date to Remove'] || ''
            };
        }

        function refreshNewsFeed() {
            const activePosts = filterActivePosts(allNewsFeedPosts);
            newsFeedPosts = activePosts;
            const secondsPerItem = dashboardConfig?.newsFeed_secondsPerItem || 20;
            const totalDurationMs = activePosts.length * secondsPerItem * 1000;
            newsFeedSlideSource.duration = totalDurationMs > 0 ? totalDurationMs : 60000;
        }

        function initializeNewsFeed() {
            onSnapshot(collection(db, 'news'), snapshot => {
                allNewsFeedPosts = snapshot.docs
                    .map(documentSnapshot => normalizeNewsPost(documentSnapshot.data(), documentSnapshot.id))
                    .sort((a, b) => new Date(b.postDate).valueOf() - new Date(a.postDate).valueOf());
                refreshNewsFeed();
            }, error => {
                console.error('News feed listener failed:', error);
                allNewsFeedPosts = [];
                refreshNewsFeed();
            });
        }
        
        function filterActivePosts(posts) {
            const now = new Date();
            return posts.filter(post => {
                if (!post.title || !post.postDate) return false;
                const postDate = new Date(post.postDate);
                if (Number.isNaN(postDate.valueOf()) || postDate > now) return false;
                return !isContentExpired(post.removeDate, now);
            });
        }

        function renderFeed(posts, feedContainer) {
            if (newsFeedSlideInterval) clearInterval(newsFeedSlideInterval);
            
            if (!feedContainer) return;
            const feedTrack = feedContainer.querySelector('#feed-track');
            if (!feedTrack) return;
            feedTrack.innerHTML = ''; 

            if (posts.length === 0) {
                feedContainer.innerHTML = `
                    <div class="w-full h-full flex flex-col justify-center items-center text-center p-10">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 text-gray-600 mb-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                        <h1 class="text-6xl text-gray-500 font-light">No Active Announcements</h1>
                        <p class="text-2xl text-gray-600 mt-4">The feed is currently empty. Please check back later.</p>
                    </div>
                `;
                return;
            }

            let itemsHtml = '';
            posts.forEach(post => {
                itemsHtml += `
                    <div class="feed-item w-full h-full absolute top-0 left-0 flex flex-col justify-center items-start p-24 sm:p-32 md:p-48">
                        <div class="w-24 h-2 bg-cyan-400 mb-8 rounded-full"></div>
                        <h1 class="text-7xl lg:text-8xl font-bold mb-6 text-white" style="text-shadow: 1px 1px 4px rgba(0,0,0,0.2);">
                            ${escapeHtml(post.title)}
                        </h1>
                        <p class="text-3xl lg:text-4xl mb-12 text-gray-200 max-w-6xl font-light">
                            ${escapeHtml(post.description)}
                        </p>
                        <div class="mt-8 pt-8 border-t border-gray-700 flex flex-wrap gap-x-10 gap-y-6 text-2xl text-gray-400">
                            ${post.location ? `<span class="flex items-center gap-3">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                <span>${escapeHtml(post.location)}</span>
                            </span>` : ''}
                            ${post.appliesTo ? `<span class="flex items-center gap-3">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 016-6h6m6 3v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                                <span>${escapeHtml(post.appliesTo)}</span>
                            </span>` : ''}
                            ${post.postedBy ? `<span class="flex items-center gap-3">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                                <span>${escapeHtml(post.postedBy)}</span>
                            </span>` : ''}
                        </div>
                    </div>
                `;
            });

            feedTrack.innerHTML = itemsHtml;
            startSlideshow(posts.length, feedTrack); 
        }

        function startSlideshow(postCount, feedTrack) {
            if (!feedTrack) return;
            const slides = feedTrack.querySelectorAll('.feed-item');
            if (slides.length === 0) return;

            if (newsFeedSlideInterval) clearInterval(newsFeedSlideInterval); 

            let currentSlideIndex = 0;
            slides[currentSlideIndex].classList.add('active'); 
            slides[currentSlideIndex].classList.remove('fading-out'); 

            if (postCount <= 1) return; 

            let slideIndex = 0; 
            const secondsPerItem = (dashboardConfig && dashboardConfig.newsFeed_secondsPerItem) ? dashboardConfig.newsFeed_secondsPerItem : 20;

            newsFeedSlideInterval = setInterval(() => {
                if (slideIndex < postCount - 1) {
                    slides[slideIndex].classList.add('fading-out'); 
                    slides[slideIndex].classList.remove('active'); 
                    slideIndex++;
                    slides[slideIndex].classList.add('active'); 
                    slides[slideIndex].classList.remove('fading-out'); 
                } else {
                    clearInterval(newsFeedSlideInterval);
                    newsFeedSlideInterval = null;
                }
            }, secondsPerItem * 1000);
        }

        async function setupGoogleSlides() {
            if (!dashboardConfig) return;

            const slidesConfig = dashboardConfig; 
            const slidesSource = slideSources.find(s => s.type === 'googleslides');

            if (!slidesConfig.googleSlides_scriptUrl || slidesConfig.googleSlides_scriptUrl.includes('PASTE') || !slidesSource) {
                if(slidesSource) {
                    slidesSource.iframe = `<div class="w-full h-full flex items-center justify-center bg-gray-800 text-yellow-300 p-8 text-center text-2xl"><strong>Configuration Needed:</strong><br>Please set your Google Slides Apps Script URL in the <strong>Admin Console</strong>.</div>`;
                    slidesSource.duration = 20000;
                }
                return;
            }

            try {
                const response = await fetch(slidesConfig.googleSlides_scriptUrl, { cache: 'no-cache' });
                if (!response.ok) throw new Error(`Failed to fetch slide count. Status: ${response.status}.`);
                
                const slideCount = parseInt(await response.text(), 10);
                if (isNaN(slideCount) || slideCount <= 0) throw new Error(`Invalid slide count received: ${slideCount}`);

                const delayMs = slidesConfig.googleSlides_delayPerSlideSeconds * 1000;
                const totalDuration = slideCount * delayMs;
                if (delayMs <= 0) {
                    slidesSource.duration = 20000; 
                } else {
                    slidesSource.duration = totalDuration;
                }
                
                const embedUrl = `${slidesConfig.googleSlides_embedUrlBase}&delayms=${delayMs}`;
                const iframeHtml = `<iframe title="Google Slides" src="${embedUrl}" frameborder="0" class="w-full h-full"></iframe>`;

                slidesSource.iframe = iframeHtml;

            } catch (error) {
                if(slidesSource){
                    slidesSource.iframe = `<div class="w-full h-full flex items-center justify-center bg-gray-800 text-red-400 p-8 text-center text-2xl"><strong>Error:</strong><br>Could not load Google Slides count.<br>${error.message}</div>`;
                    slidesSource.duration = 20000;
                }
            }
        }

        function scheduleNextSlide(duration) { 
            if (slideRotationTimer) clearTimeout(slideRotationTimer);
            slideRotationTimer = setTimeout(() => { 
                contentIndex = (contentIndex + 1) % slideSources.length; 
                rotateSlides(); 
            }, duration); 
        }

        function renderSlideSource(container, source) {
            container.replaceChildren();
            if (source.type === 'newsfeed') {
                container.innerHTML = newsFeedSlideSource.iframe;
                return;
            }

            const parser = new DOMParser();
            const legacy = parser.parseFromString(source.iframe || '', 'text/html').querySelector('iframe');
            const rawUrl = source.url || legacy?.getAttribute('src');
            if (!rawUrl) {
                const message = document.createElement('div');
                message.className = 'w-full h-full flex items-center justify-center bg-gray-800 text-yellow-300 p-8 text-center text-2xl';
                message.textContent = parser.parseFromString(source.iframe || 'Slide unavailable', 'text/html').body.textContent || 'Slide unavailable';
                container.append(message);
                return;
            }

            let slideUrl;
            try { slideUrl = new URL(rawUrl, window.location.href); } catch (_) { return; }
            if (!['https:', 'http:', 'file:'].includes(slideUrl.protocol)) return;

            const iframe = document.createElement('iframe');
            iframe.title = source.title || legacy?.getAttribute('title') || 'Dashboard slide';
            iframe.src = slideUrl.href;
            iframe.loading = 'eager';
            iframe.referrerPolicy = 'no-referrer';
            iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-presentation');
            container.append(iframe);
        }

        function rotateSlides() {
            if (slideSources.length === 0) return;
            if (contentIndex >= slideSources.length) contentIndex = 0;

            let source = slideSources[contentIndex];
            const initialIndex = contentIndex;
            
            while (source.duration === 0) {
                contentIndex = (contentIndex + 1) % slideSources.length;
                source = slideSources[contentIndex];
                if (contentIndex === initialIndex) return; 
            }

            const nextSlideIndex = 1 - activeSlideIndex;
            const currentSlide = slideDivs[activeSlideIndex];
            const nextSlide = slideDivs[nextSlideIndex];
            
            renderSlideSource(nextSlide, source);

            if (source.type === 'newsfeed') {
                if (newsFeedSlideInterval) clearInterval(newsFeedSlideInterval); 
                const feedContainer = nextSlide.querySelector('#feed-container');
                if (feedContainer) {
                    renderFeed(newsFeedPosts, feedContainer); 
                } else {
                    nextSlide.innerHTML = `<div class="w-full h-full flex items-center justify-center bg-red-800 text-white p-4">News Feed Error: Could not find #feed-container.</div>`;
                }
            } else {
                if (newsFeedSlideInterval) {
                    clearInterval(newsFeedSlideInterval);
                    newsFeedSlideInterval = null;
                }
            }

            const iframe = nextSlide.querySelector('iframe');
            
            const transition = () => {
                if (nextSlide.classList.contains('opacity-100')) return;
                currentSlide.classList.remove('opacity-100');
                currentSlide.classList.add('opacity-0');
                nextSlide.classList.remove('opacity-0');
                nextSlide.classList.add('opacity-100');
                activeSlideIndex = nextSlideIndex;
                scheduleNextSlide(source.duration);
            };

            if (iframe) {
                let loaded = false;
                const loadTimeout = setTimeout(() => {
                    if (!loaded) transition();
                }, 5000); 

                iframe.onload = () => { loaded = true; clearTimeout(loadTimeout); transition(); };
                iframe.onerror = () => {
                    loaded = true; clearTimeout(loadTimeout);
                    nextSlide.innerHTML = `<div class="w-full h-full flex items-center justify-center bg-gray-800 text-red-400 p-8 text-center text-2xl"><strong>Error:</strong><br>Could not load slide content.</div>`;
                    transition();
                };
            } else {
                transition();
            }
        }

        async function startRotation() {
            if (slideRotationTimer) clearTimeout(slideRotationTimer);
            
            await setupGoogleSlides(); 
            
            if (slideSources.length === 0) {
                slideDivs[0].innerHTML = `<div class="w-full h-full flex items-center justify-center bg-gray-800 text-yellow-300 p-8 text-center text-2xl">No slides configured. Please add slides in the admin console.</div>`;
                slideDivs[0].classList.remove('opacity-0');
                slideDivs[0].classList.add('opacity-100');
                return;
            }

            contentIndex = 0;
            let firstSource = slideSources[contentIndex];
            const initialIndex = contentIndex;
            while (firstSource.duration === 0) {
                contentIndex = (contentIndex + 1) % slideSources.length;
                firstSource = slideSources[contentIndex];
                if (contentIndex === initialIndex) { 
                    slideDivs[0].innerHTML = `<div class="w-full h-full flex items-center justify-center bg-gray-800 text-yellow-300 p-8 text-center text-2xl">All slides are currently disabled (duration 0).</div>`;
                    slideDivs[0].classList.add('opacity-100');
                    return; 
                }
            }
            
            renderSlideSource(slideDivs[0], firstSource);
            if (firstSource.type === 'newsfeed') {
                if (newsFeedSlideInterval) clearInterval(newsFeedSlideInterval);
                const feedContainer = slideDivs[0].querySelector('#feed-container');
                if (feedContainer) {
                    renderFeed(newsFeedPosts, feedContainer);
                }
            }

            slideDivs[1].innerHTML = '';
            slideDivs[1].classList.remove('opacity-100');
            slideDivs[1].classList.add('opacity-0');
            
            const transition = () => {
                if (slideDivs[0].classList.contains('opacity-100')) return;
                slideDivs[0].classList.remove('opacity-0');
                slideDivs[0].classList.add('opacity-100');
                activeSlideIndex = 0;
                scheduleNextSlide(firstSource.duration);
            };
            
            const firstIframe = slideDivs[0].querySelector('iframe');
            if(firstIframe) {
                let loaded = false;
                const loadTimeout = setTimeout(() => {
                    if (!loaded) transition();
                }, 5000);
                firstIframe.onload = () => { loaded = true; clearTimeout(loadTimeout); transition(); };
                firstIframe.onerror = () => { loaded = true; clearTimeout(loadTimeout); transition(); };
            } else {
                transition();
            }
        }

        function showIPAWSAlert(content, duration, toneName = 'default') {
          alertQueue.push({ content, duration, toneName });
          if (!alertShowing) displayNextAlert();
        }

        function displayNextAlert() {
          const next = alertQueue.shift();
          if (!next) { alertShowing = false; return; }
          alertShowing = true;
          const overlay = document.getElementById("ipawsAlertOverlay");
          overlay.replaceChildren();
          const wrapper = document.createElement('div');
          wrapper.className = 'text-center';
          if (Array.isArray(next.content)) {
            next.content.forEach((message, index) => {
              if (index) wrapper.append(document.createElement('hr'));
              const line = document.createElement('p');
              line.className = 'my-5';
              line.textContent = message;
              wrapper.append(line);
            });
          } else if (typeof next.content === 'object') {
            if (next.content.title) {
              const title = document.createElement('h1');
              title.className = 'text-6xl md:text-7xl font-black mb-4';
              title.textContent = next.content.title;
              wrapper.append(title);
            }
            const message = document.createElement('p');
            message.className = 'text-4xl md:text-5xl font-bold';
            message.textContent = next.content.message || '';
            wrapper.append(message);
          } else {
            wrapper.textContent = String(next.content || '');
          }
          overlay.append(wrapper);
          overlay.classList.remove('invisible', 'opacity-0');
          overlay.classList.add('opacity-100');
          document.body.dataset.alertActive = 'true';
          playAlertSound(next.toneName);
          setTimeout(() => {
            overlay.classList.remove('opacity-100');
            overlay.classList.add('invisible', 'opacity-0');
            document.body.dataset.alertActive = 'false';
            setTimeout(displayNextAlert, 500);
          }, next.duration);
        }

        function showDispatchModal(data, durationMs) {
            const overlay = document.getElementById("dispatchAlertOverlay");
            
            let translatedNarrative = data.nature || data.narrative || data.type || 'DISPATCH';
            let translatedCallType = data.callType || 'See CAD for details';

            // Apply custom translations from config if available
            translatedNarrative = dispatchTranslations[translatedNarrative.toLowerCase().trim()] || translatedNarrative;
            translatedCallType = dispatchTranslations[translatedCallType.toLowerCase().trim()] || translatedCallType;

            document.getElementById("run-type").textContent = translatedNarrative;
            
            document.getElementById("run-dispatch").textContent = data.dispatch || 'N/A';
            
            const runLocation = document.getElementById("run-location");
            runLocation.textContent = data.location || 'LOCATION UNKNOWN';
            
            document.getElementById("run-city").textContent = data.city || '';
            document.getElementById("run-location-info").textContent = data.locationInfo || '';
            
            document.getElementById("run-narrative").textContent = translatedCallType;
            
            const suppEl = document.getElementById("run-supplemental");
            if (Array.isArray(data.supplemental)) {
                suppEl.replaceChildren();
                data.supplemental.forEach((line, index) => {
                    if (index) suppEl.append(document.createElement('br'), document.createElement('br'));
                    suppEl.append(document.createTextNode(String(line)));
                });
            } else {
                suppEl.textContent = data.supplemental || '';
            }

            document.getElementById("run-incident").textContent = data.incidentId ? `Inc: ${data.incidentId}` : '';
            
            if (data.timestamp && typeof dayjs !== 'undefined') {
                document.getElementById("run-timestamp").textContent = dayjs(data.timestamp).format('MM/DD/YYYY HH:mm:ss');
            } else {
                document.getElementById("run-timestamp").textContent = data.timestamp || '';
            }

            // 1. MAKE MODAL VISIBLE FIRST (So the browser can measure it)
            overlay.classList.remove('hidden', 'opacity-0');
            overlay.classList.add('flex', 'opacity-100');
            document.body.dataset.alertActive = 'true';
            
            // 2. NOW AUTO-SCALE THE FONT
            runLocation.style.fontSize = ''; // Reset to default size first
            let currentSize = parseInt(window.getComputedStyle(runLocation).fontSize);
            const maxLocationHeight = 220;
            while (runLocation.scrollHeight > maxLocationHeight && currentSize > 32) {
                currentSize -= 1;
                runLocation.style.fontSize = currentSize + 'px';
            }
            
            playAlertSound('default'); 

            setTimeout(() => {
                overlay.classList.remove('opacity-100');
                overlay.classList.add('opacity-0');
                setTimeout(() => {
                    overlay.classList.remove('flex');
                    overlay.classList.add('hidden');
                    document.body.dataset.alertActive = 'false';
                }, 500); 
            }, durationMs);
        }

        function initializeDispatchListener() {
            const dispatchDocRef = doc(db, 'alerts', 'active_run');
            onSnapshot(dispatchDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const runData = docSnap.data();
                    const eventKey = buildEventKey(runData, docSnap.id);
                    if (storage.get('htfdLastDispatchEvent') === eventKey) return;
                    storage.set('htfdLastDispatchEvent', eventKey);
                    
                    const durationMs = (dashboardConfig && dashboardConfig.dispatchAlertDurationSeconds) 
                        ? dashboardConfig.dispatchAlertDurationSeconds * 1000 
                        : 120000;

                    showDispatchModal(runData, durationMs); 
                    const ackId = `${eventKey}_${deviceId}`.replace(/[^a-zA-Z0-9_-]/g, '_').slice(0, 1400);
                    setDoc(doc(db, 'alertAcks', ackId), { eventKey, deviceId, acknowledgedAt: serverTimestamp() }).catch(() => {});
                }
            }, () => updateHealth('error', 'Dispatch connection lost'));
        }

        async function fetchIPAWSAlerts() {
          if (!dashboardConfig || !dashboardConfig.nwsAlertZone) return;
          try {
            const response = await fetch(`https://api.weather.gov/alerts/active/zone/${dashboardConfig.nwsAlertZone}`, {
                headers: {
                    'Accept': 'application/geo+json',
                    'User-Agent': '(PTFD Dashboard)' 
                }
            });

            if (!response.ok) { throw new Error(`HTTP error! status: ${response.status}`); }
            const data = await response.json();
            
            const sidebarAlert = document.getElementById('sidebar-alert-display');
            if (sidebarAlert) {
                if (data.features && data.features.length > 0) {
                    const events = [...new Set(data.features.map(f => f.properties.event))];
                    sidebarAlert.replaceChildren();
                    const alertCard = document.createElement('div');
                    alertCard.className = 'bg-red-600 text-white rounded-lg p-3 animate-pulse border-2 border-red-400 shadow-lg text-center text-sm font-black uppercase tracking-wide leading-tight';
                    alertCard.textContent = events.join(' · ');
                    sidebarAlert.append(alertCard);
                    sidebarAlert.classList.remove('hidden');
                } else {
                    sidebarAlert.classList.add('hidden');
                    sidebarAlert.innerHTML = '';
                }
            }

            const newAlertMessages = [];
            if (data.features && data.features.length > 0) {
              for (const feature of data.features) {
                const alertId = feature.id;
                if (!shownAlerts.has(alertId)) {
                  newAlertMessages.push(feature.properties.headline);
                  shownAlerts.add(alertId);
                }
              }
            }
            if (newAlertMessages.length > 0) {
              const displayDuration = 60000 * newAlertMessages.length;
              showIPAWSAlert(newAlertMessages, displayDuration, 'alarm');
            }
          } catch (err) {}
        }
        
        const WEATHER_ICONS = {
            'Sunny': `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`,
            'Partly Cloudy': `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path><path d="M22 10a5 5 0 0 0-5-5h-1.26a8 8 0 0 0-11.2 3.14"></path></svg>`,
            'Cloudy': `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>`,
            'Rain': `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path><line x1="8" y1="19" x2="8" y2="21"></line><line x1="12" y1="17" x2="12" y2="23"></line><line x1="16" y1="19" x2="16" y2="21"></line></svg>`,
            'Snow': `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A5B4FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 17.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path><line x1="8" y1="15" x2="8" y2="15"></line><line x1="8" y1="19" x2="8" y2="19"></line><line x1="12" y1="17" x2="12" y2="17"></line><line x1="12" y1="21" x2="12" y2="21"></line><line x1="16" y1="15" x2="16" y2="15"></line><line x1="16" y1="19" x2="16" y2="19"></line></svg>`
        };

        function getWeatherIcon(desc, classes = 'w-full h-full') {
            let iconKey = 'Cloudy'; 
            if (!desc) return WEATHER_ICONS[iconKey].replace('width="24" height="24"', `class="${classes}"`);

            const description = desc.toLowerCase();
            
            if (description.includes('sunny') || description.includes('clear')) iconKey = 'Sunny';
            else if (description.includes('partly cloudy') || description.includes('mostly sunny')) iconKey = 'Partly Cloudy';
            else if (description.includes('cloudy') || description.includes('mostly cloudy')) iconKey = 'Cloudy';
            else if (description.includes('rain') || description.includes('shower')) iconKey = 'Rain';
            else if (description.includes('snow')) iconKey = 'Snow';
            
            if (WEATHER_ICONS[iconKey]) {
                 return WEATHER_ICONS[iconKey].replace('width="24" height="24"', `class="${classes}"`);
            } else {
                 return WEATHER_ICONS['Cloudy'].replace('width="24" height="24"', `class="${classes}"`);
            }
        }

        async function fetchToolbarWeather() {
            const lat = dashboardConfig?.weather_latitude ?? 39.9231;
            const lon = dashboardConfig?.weather_longitude ?? -83.5652;
            const configuredLocationName = String(dashboardConfig?.weather_locationName || '').trim() || "South Vienna"; 

            const userAgent = '(HTFD Dashboard, htfd-dashboard@example.com)';

            const tempEl = document.getElementById('weather-temp');
            const conditionEl = document.getElementById('weather-condition');
            const highLowEl = document.getElementById('weather-high-low');
            const locationEl = document.getElementById('weather-location');
            const iconContainer = document.getElementById('weather-icon-container');

            try {
                const pointsUrl = `https://api.weather.gov/points/${lat},${lon}`;
                const pointsResponse = await fetch(pointsUrl, { headers: { 'User-Agent': userAgent } });
                
                if (!pointsResponse.ok) throw new Error(`Points API Error: ${pointsResponse.status}`);
                const pointsData = await pointsResponse.json();

                const forecastUrl = pointsData.properties.forecast;
                const hourlyUrl = pointsData.properties.forecastHourly;

                const [forecastResponse, hourlyResponse] = await Promise.all([
                    fetch(forecastUrl, { headers: { 'User-Agent': userAgent } }),
                    fetch(hourlyUrl, { headers: { 'User-Agent': userAgent } })
                ]);

                if (!forecastResponse.ok) throw new Error("Daily Forecast API Error");
                if (!hourlyResponse.ok) throw new Error("Hourly Forecast API Error");

                const forecastData = await forecastResponse.json();
                const hourlyData = await hourlyResponse.json();

                const currentPeriod = hourlyData.properties.periods[0];
                const temp = currentPeriod.temperature;
                const description = currentPeriod.shortForecast;
                const iconSvg = getWeatherIcon(description, 'w-16 h-16'); 

                let periods = forecastData.properties.periods;
                let startIndex = periods[0].isDaytime ? 0 : 1;
                
                let high = '--';
                let low = '--';

                if (periods.length > startIndex + 1) {
                    const day = periods[startIndex];
                    const night = periods[startIndex + 1];
                    high = day.temperature;
                    low = night.temperature;
                }

                tempEl.textContent = `${temp}°`;
                conditionEl.textContent = description;
                locationEl.textContent = configuredLocationName; 
                highLowEl.textContent = `H: ${high}° L: ${low}°`;
                iconContainer.innerHTML = iconSvg; 
                storage.set('htfdCachedWeather', JSON.stringify({ temp, description, locationName: configuredLocationName, high, low }));

            } catch (error) {
                const cached = JSON.parse(storage.get('htfdCachedWeather') || 'null');
                conditionEl.textContent = cached?.description || 'Weather unavailable';
                tempEl.textContent = cached ? `${cached.temp}°` : '--°';
                locationEl.textContent = configuredLocationName;
                highLowEl.textContent = cached ? `H: ${cached.high}° L: ${cached.low}°` : 'H: --° L: --°';
                iconContainer.innerHTML = `<i data-feather="alert-triangle" class="w-16 h-16 text-yellow-400"></i>`;
                feather.replace(); 
                updateHealth('warn', navigator.onLine ? 'Weather service delayed' : 'Offline · cached weather');
            }
        }

        function initializeConfigListener() {
            const configDocRef = doc(db, 'config', 'global');
            let firstConfigLoad = true; 

            onSnapshot(configDocRef, async (docSnap) => {
                if (docSnap.exists()) {
                    dashboardConfig = docSnap.data();
                    storage.set('htfdCachedConfig', JSON.stringify(dashboardConfig));
                    storage.set('htfdLastConfigSync', new Date().toISOString());
                    updateHealth('ok', `Synced ${dayjs().format('HH:mm')}`);

                    const logoImg = document.getElementById('dashboard-logo');
                    if (dashboardConfig.logoUrl) {
                        logoImg.src = dashboardConfig.logoUrl;
                        logoImg.style.display = 'block'; 
                    } else {
                        logoImg.style.display = 'none';
                    }

                    if (ipawsInterval) clearInterval(ipawsInterval);
                    if (weatherInterval) clearInterval(weatherInterval);
                    if (slidesRefreshInterval) clearInterval(slidesRefreshInterval);

                    fetchIPAWSAlerts();
                    fetchToolbarWeather();
                    
                    if (firstConfigLoad) {
                        initializeAlertListener(); 
                        initializeDispatchListener();
                        initializeTranslationListener();
                        initializeSlideListener(); 
                        initializeForceReloadListener(); 
                        
                        initializeTicker(); 
                        initializeNewsFeed();

                        firstConfigLoad = false;
                    } else {
                        await setupGoogleSlides();
                        refreshNewsFeed();
                    }

                    const ipawsRefreshMs = (dashboardConfig.nwsAlertRefreshSeconds || 300) * 1000;
                    ipawsInterval = setInterval(fetchIPAWSAlerts, ipawsRefreshMs);
                    
                    const weatherRefreshMs = Math.max(dashboardConfig.weather_refreshIntervalMinutes || 10, 1) * 60 * 1000;
                    weatherInterval = setInterval(fetchToolbarWeather, weatherRefreshMs);

                    if (dashboardConfig.googleSlides_refreshIntervalMinutes > 0) {
                        const slidesRefreshMs = dashboardConfig.googleSlides_refreshIntervalMinutes * 60 * 1000;
                        slidesRefreshInterval = setInterval(async () => {
                            await setupGoogleSlides();
                        }, slidesRefreshMs);
                    }
                } else {
                    slideDivs[0].innerHTML = `<div class="w-full h-full flex items-center justify-center bg-red-900 text-white p-8 text-center text-3xl"><strong>FATAL ERROR:</strong><br>Global configuration not found in database. Please set it in the admin console.</div>`;
                    slideDivs[0].classList.add('opacity-100');
                    document.getElementById('dashboard-logo').style.display = 'none';
                }
            }, (error) => { 
                const cached = storage.get('htfdCachedConfig');
                if (cached) {
                    dashboardConfig = JSON.parse(cached);
                    const lastSync = storage.get('htfdLastConfigSync');
                    updateHealth('warn', `Offline · config ${lastSync ? dayjs(lastSync).format('M/D HH:mm') : 'cached'}`);
                } else {
                    slideDivs[0].replaceChildren();
                    const errorPanel = document.createElement('div');
                    errorPanel.className = 'w-full h-full flex items-center justify-center bg-red-900 text-white p-8 text-center text-3xl';
                    errorPanel.textContent = 'Dashboard configuration is unavailable. Check the network connection.';
                    slideDivs[0].append(errorPanel);
                    slideDivs[0].classList.add('opacity-100');
                    updateHealth('error', 'Configuration unavailable');
                }
                
                if (ipawsInterval) clearInterval(ipawsInterval);
                if (weatherInterval) clearInterval(weatherInterval);
                if (slidesRefreshInterval) clearInterval(slidesRefreshInterval);
            });
        }

        function initializeAlertListener() {
            const alertDocRef = doc(db, 'alerts', 'manual_alert');

            onSnapshot(alertDocRef, (docSnap) => {
                if (docSnap.exists()) { 
                    const alertData = docSnap.data();
                    if (alertData && alertData.message && alertData.duration) {
                        const eventKey = String(alertData.eventId || alertData.timestamp || docSnap.id);
                        if (storage.get('htfdLastManualAlert') === eventKey) return;
                        storage.set('htfdLastManualAlert', eventKey);
                        showIPAWSAlert({ title: alertData.title, message: alertData.message }, alertData.duration, alertData.tone || 'default');
                        const ackId = `manual_${eventKey}_${deviceId}`.replace(/[^a-zA-Z0-9_-]/g, '_').slice(0, 1400);
                        setDoc(doc(db, 'alertAcks', ackId), { eventKey, deviceId, acknowledgedAt: serverTimestamp() }).catch(() => {});
                    }
                }
            }, () => updateHealth('error', 'Alert connection lost'));
        }

        function initializeForceReloadListener() {
            const forceReloadDocRef = doc(db, 'alerts', 'force_reload');

            onSnapshot(forceReloadDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const key = String(docSnap.data().timestamp || docSnap.id);
                    if (storage.get('htfdLastReloadSignal') === key) return;
                    storage.set('htfdLastReloadSignal', key);
                    window.location.reload();
                }
            }, (error) => {});
        }

        function initializeSlideListener() {
            const slidesQuery = query(collection(db, 'slides'), orderBy('order'));
            onSnapshot(slidesQuery, (snapshot) => {
                const newSlideSources = [googleSlideSource, newsFeedSlideSource]; 
                
                snapshot.docs.forEach(doc => {
                    const data = doc.data();
                    const expired = isContentExpired(data.expiresAt);
                    if ((data.url || data.iframe) && data.duration > 0 && !expired) {
                        newSlideSources.push(data);
                    }
                });

                newSlideSources.sort((a, b) => (a.order || 99) - (b.order || 99));

                slideSources = newSlideSources; 
                storage.set('htfdCachedSlides', JSON.stringify(slideSources.filter(source => source.type !== 'newsfeed')));
                startRotation(); 
            }, (error) => {
                const cached = JSON.parse(storage.get('htfdCachedSlides') || '[]');
                slideSources = [newsFeedSlideSource, ...cached].sort((a, b) => (a.order || 99) - (b.order || 99));
                startRotation();
                updateHealth('warn', 'Offline · cached slides');
            });
        }

        function initializeTranslationListener() {
            onSnapshot(doc(db, 'config', 'translations'), snapshot => {
                dispatchTranslations = snapshot.exists() ? snapshot.data() : {};
            }, () => {});
        }
        
        function initializeFirebase() {
            try {
                if (!firebaseConfig || firebaseConfig.apiKey.startsWith("PASTE_")) return;
                
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);

                initializeConfigListener();
            } catch(e) {
                console.error('Firebase initialization failed:', e);
                updateHealth('error', 'Startup failed');
            }
        }

        initializeFirebase();
        feather.replace(); 
    });
  </script>
